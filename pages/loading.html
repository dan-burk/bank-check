<!-- Loading screen for the GitHub Pages (shinylive) build, adapted from
     RTutor's. The deploy workflow injects this before </body> of
     _site/index.html. It lives outside app/ because shinylive ships every
     file in the app folder to the browser.
     A cartoon (clerk typing SQL, rows piling up) runs beside it until then.
     webR reports no real progress, so the bar moves on a timer and slows as
     it nears 95%. The overlay stays up until Shiny has connected inside the
     app iframe AND the app's own #boot_overlay (app.R) has removed itself,
     i.e. the first charts have drawn, so the hand-off shows no blank page. -->
<style>
  #bc-loading {
    position: fixed; inset: 0; z-index: 9999; background: #F7F9FB;
    display: flex; align-items: center; justify-content: center; gap: 48px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 16px; text-align: center; transition: opacity 0.6s; overflow-y: auto;
  }
  #bc-main { display: flex; flex-direction: column; align-items: center; width: min(420px, 100%); }
  #bc-loading img { width: 64px; height: 64px; margin-bottom: 10px; }
  #bc-loading h1 { font-size: 28px; color: #1F2933; margin: 0 0 24px; font-weight: 600; }
  #bc-bar { width: min(420px, 100%); height: 10px; background: #DEE2E6; border-radius: 5px; overflow: hidden; }
  #bc-bar-fill { height: 100%; width: 2%; background: #2C5F8A; border-radius: 5px; transition: width 1s ease; }
  #bc-msg { margin-top: 14px; font-size: 17px; color: #1F2933; min-height: 1.4em; }
  #bc-joke { margin-top: 22px; font-size: 15px; color: #666; font-style: italic;
             max-width: 26rem; min-height: 3em; transition: opacity 0.4s; }
  #bc-note { margin-top: 18px; font-size: 14px; color: #666; max-width: 30rem; }
  #bc-note a { color: #2C5F8A; }
  /* Cartoon (right side; below on narrow screens) */
  #bc-toon { display: flex; flex-direction: column; align-items: center; gap: 10px;
             width: min(30rem, 100%); }
  #bc-toon .headline { font-weight: 600; font-size: 17px; color: #1F2933; }
  #bc-toon .stage { display: flex; align-items: flex-end; gap: 12px; width: 100%; justify-content: center; }
  #bc-toon svg { width: 150px; height: auto; flex: none; }
  #bc-toon .term { flex: 1; max-width: 17rem; height: 9.5rem; background: #1F2933;
    border-radius: 6px; padding: 6px 9px; font: 12px/1.35 ui-monospace, Consolas, monospace;
    color: #9FD3A8; text-align: left; overflow: hidden; }
  #bc-toon .cmd { color: #fff; white-space: pre-wrap; word-break: break-word; }
  #bc-toon .cmd::after { content: "\2588"; animation: bc-blink 1s steps(1) infinite; }
  #bc-toon.run .cmd::after { content: ""; }
  #bc-toon .rows { white-space: pre; opacity: .85; }
  #bc-toon .count { font: 600 15px ui-monospace, Consolas, monospace; color: #2C5F8A;
                    font-variant-numeric: tabular-nums; }
  #bc-toon .quip { color: #666; font-size: 15px; min-height: 2.6em; }
  /* Sweat: hidden until the query runs, then more drops as panic grows */
  #bc-toon .drop { fill: #7FB8E6; opacity: 0; }
  #bc-toon.run .d1, #bc-toon.p2 .d2, #bc-toon.p3 .d3 { animation: bc-drip 1.3s ease-in infinite; }
  #bc-toon.p2 .d2 { animation-delay: .4s; }
  #bc-toon.p3 .d3 { animation-delay: .8s; }
  #bc-toon .arms { animation: bc-type .35s ease-in-out infinite alternate; transform-origin: 60px 92px; }
  #bc-toon.run .arms { animation-duration: .18s; }
  #bc-toon.p3 .face { fill: #F6C1A8; }
  @keyframes bc-drip { 0% { opacity: 0; transform: translateY(0) scale(.6); }
    20% { opacity: 1; } 100% { opacity: 0; transform: translateY(16px) scale(1.2); } }
  @keyframes bc-type { to { transform: translateY(2px); } }
  @keyframes bc-blink { 50% { opacity: 0; } }
  /* Narrow screens: stack, cartoon below and smaller */
  @media (max-width: 860px) {
    /* safe: when taller than the screen, scroll from the top instead of clipping it */
    #bc-loading { flex-direction: column; justify-content: safe center; gap: 22px; padding: 28px 16px; }
    #bc-main, #bc-toon { flex: none; }
    #bc-toon { gap: 6px; }
    #bc-toon .headline, #bc-toon .quip { font-size: 14px; }
    #bc-toon svg { width: 90px; }
    #bc-toon .term { height: 6.2rem; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #bc-toon * { animation: none !important; }
    #bc-toon.run .drop { opacity: 1; }
  }
</style>
<div id="bc-loading">
  <div id="bc-main">
    <img src="favicon.ico" alt="">
    <h1>Bank Check</h1>
    <div id="bc-bar"><div id="bc-bar-fill"></div></div>
    <div id="bc-msg">Starting up...</div>
    <div id="bc-joke"></div>
    <!-- Empty until loading stalls; the timer below fills it -->
    <div id="bc-note"></div>
  </div>
  <!-- Cartoon: a clerk typing SQL, then sweating as the rows pile up -->
  <div id="bc-toon" role="status" aria-live="polite">
    <div class="headline"></div>
    <div class="stage" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <rect x="8" y="104" width="104" height="6" rx="2" fill="#ADB5BD"/>
        <path d="M34 104 Q36 74 60 72 Q84 74 86 104Z" fill="#2C5F8A"/>
        <circle class="face" cx="60" cy="48" r="20" fill="#FAD7C0"/>
        <path d="M41 42 Q44 24 60 26 Q76 24 79 42 Q70 34 60 35 Q50 34 41 42Z" fill="#5B6670"/>
        <circle cx="53" cy="49" r="2.3" fill="#1F2933"/><circle cx="67" cy="49" r="2.3" fill="#1F2933"/>
        <path d="M47 44 l9 -3 M73 44 l-9 -3" stroke="#1F2933" stroke-width="1.6" stroke-linecap="round"/>
        <path class="mouth" d="M54 59 Q60 56 66 59" stroke="#1F2933" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <ellipse class="drop d1" cx="80" cy="38" rx="3.2" ry="4.8"/>
        <ellipse class="drop d2" cx="40" cy="44" rx="3.2" ry="4.8"/>
        <ellipse class="drop d3" cx="76" cy="28" rx="2.8" ry="4.2"/>
        <g class="arms" stroke="#2C5F8A" stroke-width="7" stroke-linecap="round">
          <path d="M40 88 L50 98"/><path d="M80 88 L70 98"/></g>
        <path d="M28 104 L36 86 H84 L92 104Z" fill="#DEE2E6" stroke="#ADB5BD"/>
        <circle cx="60" cy="95" r="2.2" fill="#ADB5BD"/>
      </svg>
      <div class="term"><div class="cmd"></div><div class="rows"></div></div>
    </div>
    <div class="count">0 rows</div>
    <div class="quip"></div>
  </div>
</div>
<script>
  (function () {
    var steps = [
      "Starting R in your browser...",
      "Downloading the R engine...",
      "Loading Shiny...",
      "Loading dplyr...",
      "Loading plotly for charts...",
      "Loading the FDIC bank directory...",
      "Loading this quarter's numbers for every bank...",
      "Computing peer ranges...",
      "Loading bank failures since 2000...",
      "Building the interface...",
      "Drawing the first charts...",
      "Almost ready..."
    ];
    // Same jokes as the in-app fetch overlay (app/www/app.js)
    var jokes = [
      "Why did the banker quit? She lost interest.",
      "I asked the bank to check my balance. They pushed me over.",
      "Why are piggy banks so wise? Full of common cents.",
      "Old bankers never die. They just lose their balance.",
      "My bank flagged suspicious activity. Apparently saving was out of character.",
      "The safest place for cash is a snow bank. Frozen assets.",
      "Where do fish keep their money? In the river bank.",
      "The loan officer married the teller. Now it is a joint account.",
      "Quarterly filings since 1984. Good things come to those who wait.",
      "Dad, are we rich? No son, we are FDIC insured."
    ];
    // Cartoon: types the query, then rows scroll, the counter climbs and
    // the sweat and quips get worse until the app is ready
    var toon = document.getElementById("bc-toon");
    var find = function (s) { return toon.querySelector(s); };
    var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
    var EMOJI = ["\uD83D\uDE2B", "\uD83D\uDE33", "\uD83D\uDE31", "\uD83D\uDE35"];
    var QUIPS = [
      "Counting 17,949 banks by hand...",
      "Bribing the FDIC intern with donuts...",
      "Faxing 1984 for its call reports...",
      "Rewinding the microfiche...",
      "Asking Savings & Loan what happened...",
      "Converting thousands to thousands. Of thousands.",
      "Reconciling a quarter that was restated twice...",
      "Explaining JOIN to a 1984 mainframe...",
      "Adding up $24 trillion. Carry the one...",
      "Paging past the 10,000-row limit. Again."
    ];
    var SQL = "SELECT * FROM all_banks WHERE year >= 1984;";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var toonTimers = [], n = 0, c = 0, q = Math.floor(Math.random() * QUIPS.length);
    find(".headline").textContent = "Really? You're going to have me pull ALL data since 1984? " + pick(EMOJI);
    find(".quip").textContent = QUIPS[q];
    toonTimers.push(setInterval(function () {
      q = (q + 1) % QUIPS.length;
      find(".quip").textContent = QUIPS[q] + " " + pick(EMOJI);
    }, 2600));
    function row() {   // fake call-report row: cert | quarter end | assets ($000)
      return ("     " + (1 + Math.floor(Math.random() * 59999))).slice(-5) + " | " +
        (1984 + Math.floor(Math.random() * 42)) + ["0331", "0630", "0930", "1231"][n % 4] + " | " +
        Math.floor(Math.random() * 9e6).toLocaleString("en-US");
    }
    function run() {
      toon.classList.add("run");
      find(".mouth").setAttribute("d", "M54 60 Q60 60 66 60");
      var buf = [];
      toonTimers.push(setInterval(function () {
        // n/2000: speeds up gently, still readable after minutes of loading
        n += Math.floor(4000 + Math.random() * 9000 + n / 2000);
        find(".count").textContent = n.toLocaleString("en-US") + " rows...";
        if (!reduce) { buf.push(row(), row()); buf = buf.slice(-7); find(".rows").textContent = buf.join("\n"); }
        if (n > 4e5) toon.classList.add("p2");
        if (n > 1.2e6) { toon.classList.add("p3"); find(".mouth").setAttribute("d", "M54 61 Q60 57 66 61"); }
      }, reduce ? 600 : 70));
    }
    if (reduce) { find(".cmd").textContent = SQL; run(); }
    else toonTimers.push(setInterval(function () {
      find(".cmd").textContent = SQL.slice(0, ++c);
      if (c === SQL.length) { clearInterval(toonTimers.pop()); toonTimers.push(setTimeout(run, 350)); }
    }, 40));

    var fill = document.getElementById("bc-bar-fill");
    var msg = document.getElementById("bc-msg");
    var jokeEl = document.getElementById("bc-joke");
    var i = 0, pct = 2, ticks = 0;
    var j = Math.floor(Math.random() * jokes.length);
    jokeEl.textContent = jokes[j];
    var timer = setInterval(function () {
      ticks++;
      pct += (95 - pct) * 0.1;
      fill.style.width = pct + "%";
      if (i < steps.length) msg.textContent = steps[i++];
      if (ticks % 2 === 0) {
        jokeEl.style.opacity = "0";
        setTimeout(function () {
          j = (j + 1) % jokes.length;
          jokeEl.textContent = jokes[j];
          jokeEl.style.opacity = "1";
        }, 400);
      }
      // Stuck (old browser, blocked service worker, flaky network):
      // point at the server-side deployment instead of spinning forever
      if (ticks === 40) {
        document.getElementById("bc-note").innerHTML =
          "This is taking longer than usual. You can also try the " +
          '<a href="https://danielburkhalter.shinyapps.io/bank-check/">server version</a>.';
      }
    }, 3000);
    var check = setInterval(function () {
      var f = document.querySelector("iframe");
      var w = f && f.contentWindow;
      var ready = false;
      try {
        ready = !!(w && w.Shiny && w.Shiny.shinyapp && w.Shiny.shinyapp.isConnected() &&
                   !w.document.getElementById("boot_overlay"));
      } catch (e) {}
      if (!ready) return;
      clearInterval(timer); clearInterval(check);
      toonTimers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
      fill.style.width = "100%";
      msg.textContent = "Ready!";
      var o = document.getElementById("bc-loading");
      setTimeout(function () { o.style.opacity = "0"; }, 400);
      setTimeout(function () { o.remove(); }, 1100);
    }, 500);
  })();
</script>
