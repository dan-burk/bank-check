# Nightly data pipeline (pipeline/README.md). Pulls the last 10 quarters
# for every bank from the FDIC API, the FRED rate series and the FDIC
# failures list, logs any revisions against the stored raw files, rebuilds
# the marts, tests them, and publishes:
#   data-raw   release: one parquet per quarter + revisions.csv, fred.*, failures.*
#   data-marts release: the marts the app reads (fail_panel and
#              failures_meta included), plus rates_monthly,
#              research_field_coverage, bank_ids, hidden_loss,
#              hidden_loss_history and run_stress (not read by the app)
# If an app mart changed, it starts "Test and deploy" so both sites pick
# them up. Most nights nothing changed and nothing deploys.
#
# An FDIC failure (API down, a core mart check or test trips) stops the
# job before anything is uploaded, so the last good data stays live and
# GitHub emails the repo owner. A non-critical source (FRED, failures) failing holds
# back only its own files and marts: FDIC still publishes, and the job
# still fails at the end so GitHub emails. Run it by hand from the Actions tab; set
# "quarters" to 171 once for the 1984-to-now backfill
# (docs/specs/industry-history.md), and once more after RESEARCH_FIELDS
# widened the raw files (about 30 minutes; each stored quarter logs one
# <schema> row in revisions.csv).
name: Data pipeline

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      quarters:
        description: "Quarters to pull, newest first (171 = back to 1984 Q1)"
        type: number
        default: 10

permissions:
  contents: write   # upload release assets
  actions: write    # start the deploy workflow

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PKG_REPO: "https://packagemanager.posit.co/cran/__linux__/noble/2026-09-17"   # same snapshot as deploy.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    # Publishes production data, so a manual run from another branch must not
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r
        with:
          r-version: "4.5.1"

      # Same key as the deploy workflow's test job, so it reuses that cache
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-test-noble-r451-snap20260917-${{ hashFiles('DESCRIPTION') }}

      - name: Install pinned packages
        run: |
          Rscript -e '
            options(timeout = 300, warn = 1)
            pkgs <- trimws(strsplit(read.dcf("DESCRIPTION")[, "Imports"], ",")[[1]])
            install.packages(pkgs, repos = Sys.getenv("PKG_REPO"))
          '

      # The stored raw files are what the change check compares against,
      # and revisions.csv is appended to, so a failed download must stop
      # the run (a silent "first pull" would wipe the revision history).
      # An empty release is fine: that is the very first run. revisions.csv
      # is downloaded only if the asset exists (no revisions logged yet is
      # normal); if it exists, any download error stops the run. Same for
      # manifest.csv, which build.R merges into.
      - name: Download stored raw data and current marts
        run: |
          mkdir -p pipeline/out/raw prev-marts
          n=$(gh release view data-raw --json assets --jq '.assets | length')
          if [ "$n" -gt 0 ]; then
            gh release download data-raw --dir pipeline/out/raw --pattern 'risdate.*.parquet'
            assets=$(gh release view data-raw --json assets --jq '.assets[].name')
            if grep -qx revisions.csv <<< "$assets"; then
              gh release download data-raw --dir pipeline/out --pattern 'revisions.csv'
            fi
            if grep -qx manifest.csv <<< "$assets"; then
              gh release download data-raw --dir pipeline/out/raw --pattern 'manifest.csv'
            fi
            # Other sources' last good raw (fred.*, failures.*): diffed
            # against, and used as is if that source fails tonight
            for s in fred failures; do
              if grep -q "^$s\." <<< "$assets"; then
                gh release download data-raw --dir pipeline/out/raw --pattern "$s.*"
              fi
            done
          fi
          n=$(gh release view data-marts --json assets --jq '.assets | length')
          if [ "$n" -gt 0 ]; then
            gh release download data-marts --dir prev-marts
          fi

      # The marker dates this run, so the upload sends only the files it
      # wrote, not all ~170 stored quarters. Exit status 2 means a
      # non-critical source or mart failed but the FDIC marts are good:
      # publish them, then fail the job at the end (last step).
      - name: Build raw and marts
        env:
          QUARTERS: ${{ inputs.quarters }}
        run: |
          touch pipeline/out/.run-start
          set +e
          Rscript pipeline/build.R "${QUARTERS:-10}"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "PARTIAL=1" >> "$GITHUB_ENV"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      # Same tests the deploy runs, against the new marts. A mart skipped or
      # held back tonight is tested as its published copy, which is what
      # the deploy would ship. The integrity test's live phase is skipped:
      # the pipeline makes no extra API calls.
      - name: Test the new marts
        env:
          INTEGRITY_SKIP_LIVE: "1"
        run: |
          cp prev-marts/*.parquet app/data/ 2>/dev/null || true
          cp pipeline/out/marts/*.parquet app/data/
          Rscript app/tests/smoke.R
          Rscript app/tests/integrity.R

      - name: Upload raw data
        run: |
          # fred.* and failures.* are rewritten only after a good pull, so a
          # failed source uploads nothing and its last good files stay
          mapfile -t files < <(find pipeline/out/raw \( -name 'risdate.*.parquet' -o -name 'fred.*' -o -name 'failures.*' \) -newer pipeline/out/.run-start)
          files+=(pipeline/out/raw/manifest.csv)
          [ -f pipeline/out/revisions.csv ] && files+=(pipeline/out/revisions.csv)
          gh release upload data-raw "${files[@]}" --clobber

      # A mart that was skipped or failed has no file here, so its
      # published copy stays. NO_DEPLOY marts are published but the app
      # does not read them yet, so they alone do not start a deploy.
      - name: Publish marts and deploy if they changed
        env:
          NO_DEPLOY: "rates_monthly.parquet research_field_coverage.parquet bank_ids.parquet hidden_loss.parquet hidden_loss_history.parquet run_stress.parquet"
        run: |
          changed=0; deploy=0
          for f in pipeline/out/marts/*.parquet; do
            b=$(basename "$f")
            if ! cmp -s "$f" "prev-marts/$b"; then
              echo "Changed: $b"
              changed=1
              if ! grep -qw "$b" <<< "$NO_DEPLOY"; then deploy=1; fi
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "Marts unchanged; nothing to deploy."
            exit 0
          fi
          gh release upload data-marts pipeline/out/marts/*.parquet --clobber
          if [ "$deploy" -eq 1 ]; then
            gh workflow run deploy.yml --ref main
          else
            echo "Only $NO_DEPLOY changed; no deploy."
          fi

      - name: Fail if a non-critical source or mart failed
        if: env.PARTIAL == '1'
        run: |
          echo "::error::A non-critical source or mart failed (see 'Build raw and marts'). FDIC marts were published."
          exit 1
